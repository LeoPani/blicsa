<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blicsa - Interactive Map</title>
  <style>
    /* Local-first: sem @import de fonts remotas. Stack de sistema com Inter
       quando instalada, caindo para Archivo/San Francisco/Segoe/Roboto.
       Design system neoplasticista: canto zero, sem sombra, sem gradiente decorativo.
       A ÚNICA rampa contínua é a barra de cor do overlay (#legend-bar), onde o
       gradiente é informação — a escala numérica — e não enfeite. */
    body { margin: 0; padding: 0; background-color: #F6F4EE; font-family: 'Inter', 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
    #container { width: 100vw; height: 100vh; }
    #ui {
        position: absolute; top: 20px; left: 20px; z-index: 10;
        background: #ffffff; padding: 16px; border: 2px solid #141414;
        border-radius: 0; width: 260px; box-sizing: border-box;
    }
    #ui h2 { margin: 0 0 12px 0; font-size: 18px; color: #141414; font-weight: 600; }
    input[type=text] {
        width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 12px;
        border: 2px solid #141414; border-radius: 0; font-family: inherit;
    }
    button {
        padding: 8px 12px; background: #DF3117; color: white;
        border: 2px solid #141414; border-radius: 0; cursor: pointer;
        font-weight: 600; width: 100%; margin-bottom: 8px; font-family: inherit;
    }
    button:hover { background: #b82611; }
    button.secondary { background: #1E4DA0; }
    button.secondary:hover { background: #153773; }
    .clusters { margin-top: 10px; max-height: 200px; overflow-y: auto; font-size: 13px; }
    .cluster-item { display: flex; align-items: center; margin-bottom: 4px; cursor: pointer; }
    .cluster-color { width: 12px; height: 12px; border: 1px solid #141414; margin-right: 8px; }

    /* Abas dos três modos, no próprio canvas: retangulares, canto zero,
       estado ativo em cor chapada (preto do design system). */
    #tabs {
        position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
        z-index: 10; display: flex; border: 2px solid #141414; background: #FFFFFF;
    }
    #tabs button {
        width: auto; margin: 0; padding: 8px 20px; background: #FFFFFF; color: #141414;
        border: 0; border-right: 2px solid #141414; border-radius: 0; font-size: 13px;
    }
    #tabs button:last-child { border-right: 0; }
    #tabs button:hover { background: #EEEEEE; }
    #tabs button[aria-selected="true"]:hover { background: #141414; }

    /* Barra de gradiente do overlay, na base do canvas (estilo VOSviewer). */
    #legend {
        position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
        z-index: 10; background: #FFFFFF; border: 2px solid #141414; border-radius: 0;
        padding: 10px 14px; width: 320px; box-sizing: border-box; display: none;
    }
    .ctl { margin-top: 10px; font-size: 12px; color: #141414; }
    .ctl label { display: block; font-weight: 600; margin-bottom: 4px; }
    .ctl select, .ctl input[type=range] {
        width: 100%; box-sizing: border-box; font-family: inherit;
        border: 2px solid #141414; border-radius: 0; padding: 4px; background: #FFFFFF;
    }
    #edge-info { font-size: 11px; color: #555; margin-top: 8px; }

    /* Linha do tempo, abaixo do canvas. Canto zero, sem sombra. */
    #timeline {
        position: absolute; bottom: 20px; left: 20px; z-index: 10;
        background: #FFFFFF; border: 2px solid #141414; border-radius: 0;
        padding: 8px 12px; display: none; align-items: center; gap: 10px;
    }
    #timeline button {
        width: auto; margin: 0; padding: 6px 12px; background: #FFFFFF; color: #141414;
        border: 2px solid #141414; border-radius: 0; font-size: 13px;
    }
    #timeline button:hover { background: #EEEEEE; }
    #tl-scrub { width: 240px; }
    #tl-speed {
        font-family: inherit; border: 2px solid #141414; border-radius: 0;
        padding: 4px; background: #FFFFFF;
    }
    /* Indicador grande do ano corrente, tipografia Archivo, no canto do canvas. */
    #tl-year {
        position: absolute; right: 28px; top: 90px; z-index: 9;
        font-family: 'Archivo', Inter, sans-serif; font-size: 64px; font-weight: 700;
        color: #141414; opacity: 0.22; letter-spacing: -2px; pointer-events: none;
    }
    /* Modo apresentação: só o mapa. Tecla F ou o botão dedicado. */
    body.presentation #ui,
    body.presentation #edge-info { display: none !important; }
    body.presentation #tabs { opacity: 0.35; }
  </style>
</head>
<body>
  <div id="tabs" role="tablist">
    <button id="tab-network" role="tab" aria-selected="true">Network</button>
    <button id="tab-overlay" role="tab" aria-selected="false">Overlay</button>
    <button id="tab-density" role="tab" aria-selected="false">Density</button>
  </div>

  <div id="ui">
    <h2 id="map-title">Mapping</h2>
    <input type="text" id="search" placeholder="Search term...">
    <button id="reset-btn">Reset View</button>
    <button id="export-btn" class="secondary">Export PNG</button>

    <div class="ctl">
      <label id="size-by-label" for="size-by">Node size</label>
      <select id="size-by">
        <option value="occurrences">Occurrences</option>
        <option value="strength">Link strength</option>
      </select>
    </div>

    <div class="ctl" id="overlay-controls" style="display:none;">
      <label for="overlay-metric">Metric</label>
      <select id="overlay-metric">
        <option value="avg_year">Average year</option>
        <option value="avg_citations">Average citations</option>
        <option value="occurrences">Occurrences</option>
      </select>
    </div>

    <div class="ctl" id="density-controls" style="display:none;">
      <label id="density-radius-label" for="density-radius">Kernel radius</label>
      <input type="range" id="density-radius" min="1" max="20" value="5">
    </div>

    <div id="clusters-title" style="margin-top: 16px; font-weight: 600; font-size: 14px;">Clusters</div>
    <div id="clusters" class="clusters"></div>
    <div id="edge-info"></div>
  </div>

  <div id="container"></div>
  <div id="tl-year"></div>
  <div id="legend"></div>

  <div id="timeline">
    <button id="tl-play" title="Reproduzir / pausar">▶</button>
    <button id="tl-step" title="Ano a ano">⏭</button>
    <input type="range" id="tl-scrub" min="0" max="0" value="0">
    <select id="tl-speed" title="Velocidade">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
    </select>
  </div>

  <!-- Vendors locais (graphology + sigma), depois a lógica do mapa. Sem rede. -->
  <script src="vendor/blicsa-vendor.min.js"></script>
  <script src="map.js"></script>
</body>
</html>
